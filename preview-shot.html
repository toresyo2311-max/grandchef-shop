<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>preview frame (임시)</title>
<style>html,body{margin:0;background:#fff}iframe{border:0;display:block;width:100%;height:100vh}</style>
</head>
<body>
<iframe id="f" title="미리보기"></iframe>
<script>
var q = new URLSearchParams(location.search);
var w = q.get('w') || '1440';
var h = q.get('h') || '900';
var route = q.get('route') || '';
var scroll = parseInt(q.get('scroll') || '0', 10);
var f = document.getElementById('f');
f.style.width = w + 'px';
f.style.height = h + 'px';
f.src = './index.html?cb=' + Date.now() + (route ? '#/' + route : '');
f.addEventListener('load', function () {
  setTimeout(function () { try { f.contentWindow.scrollTo(0, scroll); } catch (e) {} }, 500);
});
</script>
</body>
</html>
